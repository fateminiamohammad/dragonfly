name: perception-service CI

on:
  push:
    branches: [main]
    paths: ["perception-service/**", ".github/workflows/perception-service-ci.yml"]
  pull_request:
    paths: ["perception-service/**", ".github/workflows/perception-service-ci.yml"]
  workflow_dispatch:

concurrency:
  group: perception-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: perception-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: perception-service/pyproject.toml
      - name: Install (CPU PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check --config pyproject.toml src tests
      - name: Test (stub models, no downloads)
        run: pytest -q

  image:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image (CPU torch, smoke check only)
        uses: docker/build-push-action@v6
        with:
          context: perception-service
          target: runtime
          build-args: TORCH_INDEX_URL=https://download.pytorch.org/whl/cpu
          tags: dragonfly-perception-service:ci-${{ github.sha }}
          load: true
          cache-from: type=gha,scope=perception
          cache-to: type=gha,mode=max,scope=perception
