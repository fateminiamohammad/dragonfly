name: publish images

# Pushes every service image to GHCR on each push to main (tags :<commit sha> and :latest) and on version tags (:vX.Y.Z).
# Deploy a specific commit with: ops/deploy.sh <service> ghcr.io/<owner>/dragonfly-<service>:<sha>
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: model-service
            context: model-service
            dockerfile: model-service/Dockerfile
            target: runtime
          - name: perception-service
            context: perception-service
            dockerfile: perception-service/Dockerfile
            target: runtime
          - name: backend
            context: backend
            dockerfile: backend/Dockerfile
            target: runtime
          - name: ui
            context: ui
            dockerfile: ui/Dockerfile
            target: runtime
          - name: plugin-policy
            context: .
            dockerfile: plugins/example-grpc/Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/dragonfly-${{ matrix.name }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
