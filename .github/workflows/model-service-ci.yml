name: model-service CI

on:
  push:
    branches: [main]
    paths: ["model-service/**", "plugins/**", "proto/**", "bench/**", "scripts/**", ".github/workflows/model-service-ci.yml"]
  pull_request:
    paths: ["model-service/**", "plugins/**", "proto/**", "bench/**", "scripts/**", ".github/workflows/model-service-ci.yml"]
  workflow_dispatch:

concurrency:
  group: model-service-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: model-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: model-service/pyproject.toml
      - name: Install (CPU PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
          pip install -e ../plugins/example-python
      - name: Lint
        run: ruff check --config pyproject.toml src tests ../plugins ../bench ../scripts
      - name: Test
        run: pytest -q

  image:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image (CPU torch, smoke check only)
        uses: docker/build-push-action@v6
        with:
          context: model-service
          target: runtime
          build-args: TORCH_INDEX_URL=https://download.pytorch.org/whl/cpu
          tags: dragonfly-model-service:ci-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
