# Edge proxy for local / dev (plain HTTP, one origin). Production uses templates/dragonfly.conf.template (TLS).
#   /v1/  -> model-service   hot path: straight to the model
#   /api/ -> backend
#   /     -> ui
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    client_max_body_size 30m;  # images/audio arrive base64-encoded in JSON

    location /v1/ {
        set $model_upstream http://model-service:8000;
        proxy_pass $model_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Request-Id $request_id;
    }

    location = /health {
        set $model_upstream http://model-service:8000;
        proxy_pass $model_upstream;
    }

    location /api/ {
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        set $ui_upstream http://ui:80;
        proxy_pass $ui_upstream;
    }
}
