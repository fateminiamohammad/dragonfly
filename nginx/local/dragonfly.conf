# Edge proxy for local / dev (plain HTTP, one origin). Production uses templates/dragonfly.conf.template (TLS).
#   /v1/  -> model-service   hot path: straight to the model
#   /api/ -> backend
#   /     -> ui
resolver 127.0.0.11 valid=10s;

# All model-service replicas (docker compose up --scale model-service=N): Docker DNS returns one address per replica,
# `resolve` re-reads it as replicas come and go, and least_conn sends each request to the least busy one (tier M
# requests take far longer than tier S ones, so round-robin would pile work on one replica).
upstream model_service {
    zone model_service 64k;
    least_conn;
    server model-service:8000 resolve;
    keepalive 32;
}

server {
    listen 80;
    client_max_body_size 30m;  # images/audio arrive base64-encoded in JSON

    location /v1/ {
        proxy_pass http://model_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Request-Id $request_id;
    }

    location = /health {
        proxy_pass http://model_service;
    }

    location /api/ {
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        set $ui_upstream http://ui:80;
        proxy_pass $ui_upstream;
    }
}
