# Local development: everything on http://localhost:8080 (UI, /api, /v1), hot reload for model-service and backend.
#   cp docker/.env.example docker/.env
#   docker compose -f docker-compose.local.yml --env-file docker/.env up --build
#   docker compose -f docker-compose.local.yml --env-file docker/.env --profile train run --rm trainer
# No NVIDIA GPU? Delete the `<<: *gpu` lines and set DRAGONFLY_DEVICE=cpu in docker/.env.
name: dragonfly

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  postgres:
    image: postgres:16-alpine
    container_name: dragonfly-postgres
    env_file: docker/.env
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: dragonfly-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  model-service:
    build:
      context: ./model-service
      target: dev
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cu126}
    container_name: dragonfly-model-service
    env_file: docker/.env
    environment:
      REDIS_URL: redis://redis:6379
      PERCEPTION_URL: ${PERCEPTION_URL-http://perception-service:8001}
    ports:
      - "${MODEL_SERVICE_PORT:-8000}:8000"
    volumes:
      - ./model-service/src:/app/src
      - ./runs:/runs
      - hfcache:/models/hf
    <<: *gpu
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s

  # images and audio -> text (non-autoregressive: CTC speech, PP-OCR, SigLIP-2 tags). Internal: reached via model-service.
  perception-service:
    build:
      context: ./perception-service
      target: dev
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cu126}
    container_name: dragonfly-perception
    env_file: docker/.env
    volumes:
      - ./perception-service/src:/app/src
      - hfcache:/models/hf
    <<: *gpu
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s

  backend:
    build:
      context: ./backend
      target: dev
    container_name: dragonfly-backend
    env_file: docker/.env
    environment:
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379
      MODEL_SERVICE_URL: http://model-service:8000
    volumes:
      - ./backend/src:/app/src
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  ui:
    build:
      context: ./ui
    container_name: dragonfly-ui

  nginx:
    image: nginx:1.27-alpine
    container_name: dragonfly-nginx
    ports:
      - "${EDGE_PORT:-8080}:80"
    volumes:
      - ./nginx/local/dragonfly.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend, ui]

  trainer:
    profiles: [train]
    build:
      context: ./model-service
      target: dev
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cu126}
    container_name: dragonfly-trainer
    env_file: docker/.env
    volumes:
      - ./model-service/src:/app/src
      - ./data:/data
      - ./runs:/runs
      - hfcache:/models/hf
    <<: *gpu
    command: >
      dragonfly-train
        --train /data/decision-v2/train.jsonl
        --calibration /data/decision-v2/calibration.jsonl
        --test /data/decision-v2/test.jsonl
        --out /runs/dragonfly-s

  # Dragonfly-M: Qwen3-1.7B + LoRA. Sized for a 24 GB GPU with gradient checkpointing (lower --batch-size if OOM).
  trainer-m:
    profiles: [train-m]
    build:
      context: ./model-service
      target: dev
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cu126}
    container_name: dragonfly-trainer-m
    env_file: docker/.env
    volumes:
      - ./model-service/src:/app/src
      - ./data:/data
      - ./runs:/runs
      - hfcache:/models/hf
    <<: *gpu
    command: >
      dragonfly-train --tier M
        --backbone Qwen/Qwen3-1.7B-Base
        --grad-checkpointing --batch-size 8 --epochs 2
        --train /data/decision-v2/train.jsonl
        --calibration /data/decision-v2/calibration.jsonl
        --test /data/decision-v2/test.jsonl
        --out /runs/dragonfly-m

  # Example out-of-process plugin (any language): enable with DRAGONFLY_GRPC_PLUGINS=policy@plugin-policy:50051
  plugin-policy:
    profiles: [plugins]
    build:
      context: .
      dockerfile: plugins/example-grpc/Dockerfile
    container_name: dragonfly-plugin-policy
    environment:
      MIN_CONFIDENCE: "0.5"

  # A local LLM on the same GPU for the comparison (OpenAI-compatible API at http://llm:11434/v1):
  #   docker compose ... --profile llm up -d llm && docker exec dragonfly-llm ollama pull qwen2.5:7b-instruct
  llm:
    profiles: [llm]
    image: ollama/ollama:latest
    container_name: dragonfly-llm
    ports:
      - "127.0.0.1:11434:11434"  # host benchmarks (bench/compare_media.py); loopback only
    volumes:
      - ollamadata:/root/.ollama
    <<: *gpu

  # Dragonfly vs an LLM API (set LLM_BASE_URL / LLM_API_KEY / LLM_MODEL in docker/.env).
  bench:
    profiles: [bench]
    image: python:3.12-slim
    container_name: dragonfly-bench
    env_file: docker/.env
    working_dir: /work
    volumes:
      - ./bench:/work/bench:ro
      - ./data:/work/data:ro
      - ./runs:/work/runs
    command: >
      python bench/compare_llm.py --data data/decision-v2/test.jsonl --n 50
        --dragonfly http://model-service:8000 --out runs/compare-llm.json

volumes:
  ollamadata:
  pgdata:
  redisdata:
  hfcache:
