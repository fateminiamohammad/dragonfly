[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dragonfly-model"
version = "0.1.0.dev0"
description = "Dragonfly: an open-source System One decision model. Typed questions in, calibrated probabilities out, one forward pass."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "transformers>=4.48",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "prometheus-client>=0.20",
    "numpy>=1.26",
    "redis>=5.0",
]

[project.optional-dependencies]
train = ["datasets>=3.0"]
grpc = ["grpcio>=1.66"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "fakeredis>=2.20", "grpcio>=1.66", "grpcio-tools>=1.66"]

[project.scripts]
dragonfly-serve = "dragonfly.api.serve:main"
dragonfly-train = "dragonfly.training.train:main"
dragonfly-eval = "dragonfly.training.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905", "UP007"]  # zip() lengths are equal by construction; Union aliases read clearer for JSON types

[tool.ruff.lint.isort]
known-first-party = ["dragonfly"]
