[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dragonfly-perception"
version = "0.1.0.dev0"
description = "Dragonfly perception: images and audio to text with non-autoregressive models (CTC ASR, PP-OCR, SigLIP-2 tags)."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "transformers>=4.48",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "prometheus-client>=0.20",
    "numpy>=1.26",
    "pillow>=10",
    "soundfile>=0.12",
    "librosa>=0.10",
    "sentencepiece>=0.2",
    "rapidocr>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
dragonfly-perception = "perception.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
perception = ["tags_default.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905", "UP007", "B023"]

[tool.ruff.lint.isort]
known-first-party = ["perception"]
